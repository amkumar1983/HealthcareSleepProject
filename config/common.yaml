# Settings shared across dev/test/prod. Environment-specific overrides live in
# config/<env>/pipeline_config.yaml and are deep-merged on top of this file.

pipeline:
  name: sleepapnea-device-platform
  bronze_table_suffix: bronze
  silver_table_suffix: silver
  gold_table_suffix: gold

storage:
  containers:
    raw: "abfss://raw@{account_name}.dfs.core.windows.net/sleep_apnea/"
    bronze: "abfss://bronze@{account_name}.dfs.core.windows.net/sleep_apnea/"
    silver: "abfss://silver@{account_name}.dfs.core.windows.net/sleep_apnea/"
    gold: "abfss://gold@{account_name}.dfs.core.windows.net/sleep_apnea/"
    checkpoints: "abfss://checkpoints@{account_name}.dfs.core.windows.net/sleep_apnea/"
    schema_inference: "abfss://checkpoints@{account_name}.dfs.core.windows.net/sleep_apnea/_schemas/"

unity_catalog:
  bronze_schema: bronze
  silver_schema: silver
  gold_schema: gold
  identity_vault_schema: phi_restricted

quality:
  quarantine_table: quarantine.device_sessions_rejected
  fail_pipeline_on_quarantine_pct_above: 0.10  # abort job if >10% of a batch is rejected

security:
  secret_scope: sleepapnea-kv-scope
  secrets:
    pseudonymization_salt: phi-pseudonymization-salt
    storage_account_key: storage-account-key   # prefer managed identity / OAuth over this where possible

tags:
  data_classification: PHI
  project: sleep-apnea-device-platform
